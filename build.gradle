plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '1.4.0'
description = 'file-service'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

ext {
    awsSdkVersion = '2.31.59'
}

dependencies {
    // ???붿껌 泥섎━. board-app-infra-lecture ? 媛숈? ?ㅽ???
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'

    // ?앹〈 ?뺤씤(/actuator/health)怨?鍮뚮뱶 ?뺣낫(/actuator/info).
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // AWS SDK for Java 2.x ??踰꾩쟾? BOM ?섎굹濡?留욎땄.
    implementation platform("software.amazon.awssdk:bom:${awsSdkVersion}")
    implementation 'software.amazon.awssdk:s3'

    // ?뚯씪 紐⑸줉??DB ?? local ? H2(硫붾え由?, prod ??RDS MySQL.
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    runtimeOnly 'com.h2database:h2'
    runtimeOnly 'com.mysql:mysql-connector-j'

    // 紐⑸줉 罹먯떆. local ? 硫붾え由?simple), prod ??ElastiCache(Valkey 쨌 Redis ?꾨줈?좎퐳).
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    // ?뚯씪 ?대깽??湲곕줉. prod ??DynamoDB (媛숈? AWS SDK BOM).
    implementation 'software.amazon.awssdk:dynamodb'

    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// /actuator/info ??build ??ぉ(version 쨌 time)??留뚮벀. 諛고룷 ??"?대뒓 踰꾩쟾?????덈굹"瑜??ш린???뺤씤??
springBoot {
    buildInfo()
}

tasks.named('test') {
    useJUnitPlatform()
}

